# NCCL Test Configuration
description = "split_mask_sweep"
library_name = "nccl"

[common]
path = "${NCCL_TEST_PATH}"

[common.sweep_envs]
NCCL_DEBUG = "WARN"
NCCL_DEBUG_FILE = "nccl_debug_file.%h.%p.txt"
NCCL_TESTS_SPLIT_MASK = ["0x0", "0x1", "0x3", "0x7"]

[common.sweep_args]
-t = 1
-g = 1
-f = 2
-n = 20
-w = 5
-b = "8"
-e = "16G"
-d = "float"
-R = 0

# Define test configurations for each collective
[[test]]
name = "all_reduce"
binary = "all_reduce_perf"

[[test]]
name = "all_gather"
binary = "all_gather_perf"

[[test]]
name = "reduce_scatter"
binary = "reduce_scatter_perf"

[[test]]
name = "alltoall"
binary = "alltoall_perf"
[test.sweep_args]
-d = "uint8"

[[test]]
name = "sendrecv"
binary = "sendrecv_perf"
[test.sweep_args]
-d = "uint8"
