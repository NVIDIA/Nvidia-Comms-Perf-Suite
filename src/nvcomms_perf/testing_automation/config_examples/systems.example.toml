[common]

[common.run_params]
sbatch = [
    "--exclusive",
    "--mem=0",
    "--mail-type=FAIL",
    "--output=%x_%j.out",
    "--comment=sysctl-sys.kernel.numa_balancing=0,transparent_hugepage_defrag=never,transparent_hugepage=never"
]

srun = [
    "-N ${SLURM_JOB_NUM_NODES}",
    "--mpi=pmix"
]

openmpi = [
    "-np ${LOG_NPS}",
    "-N ${nps}",
    "--map-by ppr:${nps}:node",
    "--oversubscribe",
    "--mca btl tcp,self",
    "--mca btl_tcp_if_include $TCP_IF_INCLUDE",
    "--mca coll_hcoll_enable 0",
    "-x UCX_TLS=rc,sm",
    "-x UCX_NET_DEVICES=$UCX_NET_DEVICE",
    "--bind-to numa"
]

mpich = []

# Define system-specific parameters
# the list of one run_param will be merged with the list of the corresponding run_param in common
# the duplicated element will be removed

[CLUSTER_1]

[CLUSTER_1.labels]
name = "CLUSTER_1"
network = "IB"
switch = "Quantum2"
nic = "CX7"
gpu_type = "H100-DGX"

[CLUSTER_1.run_params]
sbatch = [
    "--gres=gpu:8",
    "--ntasks-per-node=8"
]
openmpi = [
    "TCP_IF_INCLUDE=eth0",
    "UCX_NET_DEVICE=mlx5_0:1"
]
nccl = [
    "NCCL_IB_TIMEOUT=20",
]
